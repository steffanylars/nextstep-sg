<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NextStep SG, latest scam alerts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--sand-0:#FFFFFF;--sand-2:#E9EEF9;--sand-card:#EEF2FB;--ink:#30414E;--teal-ink:#243B52;--teal:#3E6E78;--amber:#4E7C86;--terra:#C8151B;--line:rgba(36,59,82,.18);--shadow:0 16px 40px rgba(36,59,82,.08);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sand-0),var(--sand-2));min-height:100vh;}
  .wrap{max-width:620px;margin:0 auto;padding:26px 18px 60px;}
  .brand{font-family:'Fraunces',serif;font-weight:500;font-size:22px;color:var(--teal-ink);display:flex;align-items:center;gap:9px;text-decoration:none;}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--amber);}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:28px;color:var(--teal-ink);margin:16px 0 4px;letter-spacing:-.5px;}
  .upd{font-size:12.5px;color:rgba(36,59,82,.6);margin:0 0 20px;}
  #alerts{display:flex;flex-direction:column;gap:13px;}
  .alert-card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:14px;padding:16px 18px;box-shadow:0 8px 22px rgba(36,59,82,.06);}
  .alert-card .a-date{font-size:11.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--terra);}
  .alert-card .a-title{font-weight:700;font-size:15.5px;line-height:1.35;color:var(--teal-ink);margin:4px 0 5px;}
  .alert-card .a-what{font-size:13.5px;line-height:1.5;color:rgba(36,59,82,.82);}
  .alert-card .a-stat{display:inline-block;font-size:12px;font-weight:700;color:#8A1114;background:#FBEAEA;border-radius:6px;padding:2px 9px;margin-top:9px;}
  .alert-card .a-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;flex-wrap:wrap;}
  .alert-card .a-btn{font-size:13.5px;font-weight:700;color:#fff;background:var(--amber);border-radius:999px;padding:8px 15px;text-decoration:none;}
  .alert-card .a-src{font-size:12px;font-weight:700;color:var(--teal);text-decoration:none;}
  .back{display:inline-block;margin-top:26px;color:var(--teal);font-weight:700;text-decoration:none;}
  .disc{font-size:12px;color:rgba(36,59,82,.55);margin-top:22px;line-height:1.5;}
  .tabs{display:flex;gap:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px;margin:14px 0 6px;box-shadow:var(--shadow);}
  .tabs .tab{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--teal);text-decoration:none;padding:9px 6px;border-radius:999px;white-space:nowrap;}
  .tabs .tab.active{background:var(--amber);color:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="index.html"><span class="dot"></span> NextStep</a>
  <nav class="tabs">
    <a href="index.html" class="tab">Report</a>
    <a href="alerts.html" class="tab active">News</a>
    <a href="quiz.html" class="tab">Play &amp; win</a>
  </nav>
  <h1>Latest scam alerts</h1>
  <p class="upd" id="upd"></p>
  <div id="alerts"></div>
  <p class="disc">These alerts are summarised from official Singapore Police Force advisories (tap “Source: SPF”). If one of these happened to you, the button takes you straight into the right NextStep plan.</p>
  <a class="back" href="index.html">← Back to NextStep</a>
</div>
<script src="alerts.js"></script>
<script>
  document.getElementById("upd").textContent = window.NEXTSTEP_ALERTS.updated;
  window.renderAlertCards(document.getElementById("alerts"), {
    btnHref: "index.html?start=scam",
    btnLabel: "If it happened to you →"
  });
</script>
</body>
</html>
